name: Attach verified Mac candidate to draft
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        required: true
        type: string
      release_id:
        required: true
        type: string
      release_tag:
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  upload:
    if: github.actor == 'hemanth-reddy18'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: Sun-macOS-universal
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify image and attach to unpublished draft only
        env:
          SUN_RELEASE_TOKEN: ${{ github.token }}
          SUN_RELEASE_ID: ${{ inputs.release_id }}
          SUN_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          hdiutil verify candidate/Sun-TV-Mac-universal.dmg
          node --input-type=module <<'JS'
          import fs from 'node:fs';import crypto from 'node:crypto';
          const headers={Authorization:'Bearer '+process.env.SUN_RELEASE_TOKEN};
          const base='https://api.github.com/repos/hemanth-reddy18/Sun-Launcher-Releases';
          if(!/^\d+$/.test(process.env.SUN_RELEASE_ID)||!/^v\d+\.\d+\.\d+$/.test(process.env.SUN_RELEASE_TAG))throw Error('Invalid release input');
          const response=await fetch(base+'/releases/'+process.env.SUN_RELEASE_ID,{headers});if(!response.ok)throw Error('Release unavailable');
          const release=await response.json();if(!release.draft||release.tag_name!==process.env.SUN_RELEASE_TAG)throw Error('Expected unpublished preview draft');
          const file='candidate/Sun-TV-Mac-universal.dmg';const hash=crypto.createHash('sha256');for await(const chunk of fs.createReadStream(file))hash.update(chunk);const digest='sha256:'+hash.digest('hex');
          const old=release.assets.find(a=>a.name==='Sun-TV-Mac-universal.dmg');if(old){const r=await fetch(base+'/releases/assets/'+old.id,{method:'DELETE',headers});if(r.status!==204)throw Error('Old draft asset could not be replaced');}
          const r=await fetch(release.upload_url.replace(/\{.*$/,'')+'?name=Sun-TV-Mac-universal.dmg',{method:'POST',headers:{...headers,'Content-Type':'application/octet-stream'},body:await fs.openAsBlob(file),signal:AbortSignal.timeout(300000)});
          const asset=await r.json();if(r.status!==201||asset.digest!==digest||asset.size!==fs.statSync(file).size)throw Error('Uploaded Mac asset integrity mismatch');console.log('Verified draft Mac asset:',asset.id,asset.size,digest);
          JS
