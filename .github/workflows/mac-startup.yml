name: Verify packaged Mac startup
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Sun Mac build run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    if: github.actor == 'hemanth-reddy18'
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: Download the built DMG
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: Sun-macOS-universal
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: mac-candidate
      - name: Verify disk image and run packaged startup twice
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sun-mac-mount"
          hdiutil verify mac-candidate/Sun-TV-Mac-universal.dmg
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/sun-mac-mount" mac-candidate/Sun-TV-Mac-universal.dmg
          ditto "$RUNNER_TEMP/sun-mac-mount/Sun Launcher.app" "$RUNNER_TEMP/Sun Launcher.app"
          hdiutil detach "$RUNNER_TEMP/sun-mac-mount"
          codesign --verify --deep --strict "$RUNNER_TEMP/Sun Launcher.app"
          python3 - <<'PY'
          import os,pathlib,subprocess,time,json
          bundle=pathlib.Path(os.environ['RUNNER_TEMP'])/'Sun Launcher.app'
          report=pathlib.Path('/tmp/sun-desktop-test.json')
          for attempt in range(2):
              report.unlink(missing_ok=True)
              result=subprocess.run(['/usr/bin/open','-n','-W',str(bundle),'--args','--smoke-test'],timeout=60,capture_output=True,text=True)
              if not report.exists():
                  raise SystemExit('LaunchServices startup produced no QA report; exit '+str(result.returncode))
              data=json.loads(report.read_text())
              if not all(data.get(k) for k in ['desktop','controls','fullscreen','bodyDesktop']):
                  raise SystemExit('Packaged native bridge validation failed')
              print('Packaged LaunchServices startup passed:',attempt+1)
          PY
      - name: Native crash category
        if: failure()
        shell: bash
        run: |
          /usr/bin/lldb --batch -o run -o 'thread backtrace all' -- "$RUNNER_TEMP/Sun Launcher.app/Contents/MacOS/Sun Launcher" --smoke-test --enable-logging=stderr > "$RUNNER_TEMP/sun-native-trace.txt" 2>&1 || true
          python3 - <<'PY'
          import os,pathlib,re
          lines=(pathlib.Path(os.environ['RUNNER_TEMP'])/'sun-native-trace.txt').read_text(errors='replace').splitlines()
          for line in lines:
              if len(line)<1200 and re.search(r'stop reason|EXC_|SIGTRAP|frame #|error:|FATAL|CHECK failed|ERROR|Check failed|Assertion',line):
                  print(line)
          PY
          sleep 8
          python3 - <<'PY'
          import pathlib,json
          for name in ['Sun Launcher','sun-tv']:
              log=pathlib.Path.home()/'Library/Application Support'/name/'diagnostics/runtime.jsonl'
              if log.exists(): print('Sun diagnostic events:',log.read_text().splitlines()[-3:])
          folder=pathlib.Path.home()/'Library/Logs/DiagnosticReports'
          files=sorted(folder.glob('Sun*.ips'),key=lambda p:p.stat().st_mtime,reverse=True)
          for p in files[:1]:
              text=p.read_text()
              try:
                  data=json.loads(text.split('\n',1)[1])
                  print(json.dumps({k:data.get(k) for k in ['exception','termination','asi','codeSigningID','codeSigningTeamID']}))
              except Exception:
                  print('Native crash report exists but could not be parsed')
          PY
