name: Isolate Sun Mac startup services
on:
  workflow_dispatch:
    inputs:
      source_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  probe:
    if: github.actor == 'hemanth-reddy18'
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: Validate revision
        env:
          SUN_REF: ${{ inputs.source_ref }}
        run: '[[ "$SUN_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hemanth-reddy18/Suntv
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SUN_SOURCE_SSH_KEY }}
          persist-credentials: false
          path: source
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Run isolated diagnostic variants
        working-directory: source
        shell: bash
        run: |
          npm ci --ignore-scripts > "$RUNNER_TEMP/probe-install.log" 2>&1
          arch=$(uname -m)
          if [ "$arch" = "arm64" ]; then runtime_arch=arm64; else runtime_arch=x64; fi
          curl --fail --silent --show-error --location "https://github.com/electron/electron/releases/download/v44.9.1/electron-v44.9.1-darwin-$runtime_arch.zip" -o "$RUNNER_TEMP/runtime.zip"
          mkdir -p "$RUNNER_TEMP/runtime"
          ditto -x -k "$RUNNER_TEMP/runtime.zip" "$RUNNER_TEMP/runtime"
          python3 - <<'PY'
          import os,pathlib,subprocess,json
          root=pathlib.Path(os.environ['RUNNER_TEMP']); main=pathlib.Path('desktop/main.cjs'); original=main.read_text()
          variants={'baseline':'','icons':'app.getFileIcon=async()=>nativeImage.createEmpty();','window':'','gpu':'app.disableHardwareAcceleration();'}
          for name,extra in variants.items():
              text=original.replace("protocol.registerSchemesAsPrivileged", "app.setPath('userData',process.env.SUN_PROBE_PROFILE);"+extra+"protocol.registerSchemesAsPrivileged",1)
              if name=='window': text=text.replace('fullscreen:true,show:false','fullscreen:false,show:false')
              text=text.replace("const u=new URL(request.url);", "diagnostics.record('protocol-request');const u=new URL(request.url);")
              main.write_text(text)
              profile=root/('sun-probe-'+name); profile.mkdir(exist_ok=True)
              report=pathlib.Path(os.environ.get('TMPDIR','/tmp'))/'sun-desktop-test.json'; report.unlink(missing_ok=True)
              try:
                  r=subprocess.run([str(root/'runtime/Electron.app/Contents/MacOS/Electron'),'.','--smoke-test','--enable-logging=stderr'],env={**os.environ,'SUN_PROBE_PROFILE':str(profile)},capture_output=True,text=True,timeout=40)
                  print('Sun startup variant:',name,'exit:',r.returncode,'report:',report.exists())
              except subprocess.TimeoutExpired: print('Sun startup variant:',name,'timeout')
              log=profile/'diagnostics/runtime.jsonl'
              if log.exists(): print('Milestones:',[json.loads(x)['category'] for x in log.read_text().splitlines()][-8:])
          main.write_text(original)
          PY
      - name: Remove private checkout
        if: always()
        run: rm -rf -- source
